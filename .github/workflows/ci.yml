name: Frontend CI

on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]
  workflow_dispatch:

jobs:
  build:
    name: Lint and production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
      NEXT_PUBLIC_USE_MOCKS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The committed lockfile currently has a pre-existing dependency-tree mismatch.
      # npm install reconciles it in the ephemeral runner without committing lockfile changes.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
      - name: Build production app
        run: npm run build
